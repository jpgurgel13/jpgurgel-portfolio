<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Portfólio do JP (jpgurgel), desenvolvedor front-end em formação: projetos com HTML, CSS, JavaScript, TypeScript e React."
    />
    <meta name="theme-color" content="#0d1117" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="jpgurgel | Dev. Front-end" />
    <meta
      property="og:description"
      content="Projetos, trajetória e contato do JP, desenvolvedor front-end em formação."
    />
    <meta property="og:url" content="https://jpgurgel-portfolio.vercel.app/" />
    <link rel="icon" type="image/svg+xml" href="/jp-favicon.svg" />
    <script>
      // Aplica o tema salvo antes da página aparecer, para não "piscar" o escuro.
      // A chave é a mesma do ThemeToggle.tsx.
      try {
        if (localStorage.getItem("jpgurgel-theme") === "light") {
          document.documentElement.dataset.theme = "light";
        }
      } catch (error) {}
    </script>
    <title>jpgurgel | Dev. Front-end</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
